<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>İş İlanı Oluştur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .sidebar .nav-link {
            color: #333;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .main-content {
            padding: 20px;
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="d-flex flex-column">
                    <div class="text-center mb-4">
                        <h4>İşveren Paneli</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/employer/dashboard">
                                <i class="fas fa-home"></i> Ana Sayfa
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/employer/jobs/create">
                                <i class="fas fa-plus-circle"></i> İlan Oluştur
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/employer/jobs">
                                <i class="fas fa-briefcase"></i> İlanlarım
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/employer/applications">
                                <i class="fas fa-file-alt"></i> Başvurular
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/employer/profile">
                                <i class="fas fa-user"></i> Profil
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logout">
                                <i class="fas fa-sign-out-alt"></i> Çıkış
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="form-container">
                    <h2 class="mb-4">Yeni İş İlanı Oluştur</h2>
                    <form th:action="@{/employer/jobs/create}" th:object="${jobPosting}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label">İlan Başlığı</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">İş Tanımı</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="5" required></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="jobType" class="form-label">İş Tipi</label>
                                <select class="form-select" id="jobType" th:field="*{jobType}" required>
                                    <option value="FULL_TIME">Tam Zamanlı</option>
                                    <option value="PART_TIME">Yarı Zamanlı</option>
                                    <option value="REMOTE">Uzaktan</option>
                                    <option value="INTERNSHIP">Staj</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="location" class="form-label">Lokasyon</label>
                                <select class="form-select" id="location" th:field="*{location}" required>
                                    <option value="ISTANBUL">İstanbul</option>
                                    <option value="ANKARA">Ankara</option>
                                    <option value="IZMIR">İzmir</option>
                                    <option value="REMOTE">Uzaktan</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="salary" class="form-label">Maaş Aralığı</label>
                                <input type="text" class="form-control" id="salary" th:field="*{salary}" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="experienceLevel" class="form-label">Deneyim Seviyesi</label>
                                <select class="form-select" id="experienceLevel" th:field="*{experienceLevel}" required>
                                    <option value="ENTRY">Giriş Seviyesi</option>
                                    <option value="MID">Orta Seviye</option>
                                    <option value="SENIOR">Kıdemli</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="requiredSkills" class="form-label">Gerekli Yetenekler</label>
                            <input type="text" class="form-control" id="requiredSkills" th:field="*{requiredSkills}" 
                                   placeholder="Örn: Java, Spring Boot, SQL" required>
                            <div class="form-text">Yetenekleri virgülle ayırın</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="applicationDeadline" class="form-label">Son Başvuru Tarihi</label>
                            <input type="date" class="form-control" id="applicationDeadline" th:field="*{applicationDeadline}" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">İlanı Yayınla</button>
                            <a href="/employer/dashboard" class="btn btn-secondary">İptal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
